<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Live Weather Dashboard - Real-time atmospheric conditions and 5-day forecasts powered by Open-Meteo APIs.">
  <title>Live Weather Dashboard | Real-Time Forecast</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Background Glow Accents -->
  <div class="ambient-glow ambient-glow-1" aria-hidden="true"></div>
  <div class="ambient-glow ambient-glow-2" aria-hidden="true"></div>

  <!-- SVG Sprite Definitions (Clean Minimalist Vector Icons - 100% Emoji-Free) -->
  <svg style="display: none;" aria-hidden="true">
    <defs>
      <!-- Search Icon -->
      <g id="icon-search">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" />
        <path d="M16.5 16.5L21.5 21.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Location Pin Icon -->
      <g id="icon-location">
        <path d="M12 21C16 16.5 19 13.5 19 9.5C19 5.63 15.87 2.5 12 2.5C8.13 2.5 5 5.63 5 9.5C5 13.5 8 16.5 12 21Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round" />
        <circle cx="12" cy="9.5" r="2.5" stroke="currentColor" stroke-width="2" fill="none" />
      </g>

      <!-- Calendar Icon -->
      <g id="icon-calendar">
        <rect x="3" y="4" width="18" height="18" rx="3" stroke="currentColor" stroke-width="2" fill="none" />
        <path d="M16 2V6M8 2V6M3 10H21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Humidity Droplet Icon -->
      <g id="icon-humidity">
        <path d="M12 3C12 3 6 10 6 15C6 18.31 8.69 21 12 21C15.31 21 18 18.31 18 15C18 10 12 3 12 3Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round" />
        <path d="M10 14C10 12.5 11 11.5 12 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Wind Speed Icon -->
      <g id="icon-wind">
        <path d="M3 8H15C16.66 8 18 6.66 18 5C18 3.34 16.66 2 15 2C13.5 2 12.3 3.1 12.05 4.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
        <path d="M2 13H19C20.66 13 22 14.34 22 16C22 17.66 20.66 19 19 19C17.5 19 16.3 17.9 16.05 16.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
        <path d="M4 18H11C12.1 18 13 18.9 13 20C13 21.1 12.1 22 11 22C10 22 9.2 21.3 9.05 20.3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
      </g>

      <!-- Temperature Max (High) Arrow Icon -->
      <g id="icon-temp-high">
        <path d="M12 19V5M12 5L6 11M12 5L18 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Temperature Min (Low) Arrow Icon -->
      <g id="icon-temp-low">
        <path d="M12 5V19M12 19L6 13M12 19L18 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>

      <!-- Alert Warning Icon -->
      <g id="icon-alert-warning">
        <path d="M12 3L2 21H22L12 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
        <path d="M12 9V14M12 17.5V18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Alert Error Icon -->
      <g id="icon-alert-error">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" fill="none" />
        <path d="M12 8V12M12 16H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Loading Spinner Icon -->
      <g id="icon-spinner">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" stroke-dasharray="40 16" fill="none" />
      </g>

      <!-- WEATHER ICONS -->
      <!-- Clear Sky / Sunny -->
      <g id="icon-clear">
        <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 2V4.5M12 19.5V22M2 12H4.5M19.5 12H22M4.93 4.93L6.7 6.7M17.3 17.3L19.07 19.07M4.93 19.07L6.7 17.3M17.3 6.7L19.07 4.93" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Mainly Clear / Few Clouds -->
      <g id="icon-mainly-clear">
        <path d="M8.5 7.5A4 4 0 0 1 15 5.5A4 4 0 0 1 17 9" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" />
        <path d="M16 2.5V4M20.5 4.5L19.5 5.5M22 9H20.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path d="M6.5 19H17.5C19.43 19 21 17.43 21 15.5C21 13.68 19.6 12.18 17.8 12.03C17.4 9.17 14.95 7 12 7C9.37 7 7.15 8.74 6.35 11.2C4.42 11.45 3 13.06 3 15C3 17.21 4.79 19 6.5 19Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round" />
      </g>

      <!-- Partly Cloudy -->
      <g id="icon-partly-cloudy">
        <path d="M7 6A3.5 3.5 0 0 1 13 4.2A3.5 3.5 0 0 1 15 7.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" />
        <path d="M13 1.5V3M17.5 3.5L16.5 4.5M19 7.5H17.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path d="M6 19.5H17C19.21 19.5 21 17.71 21 15.5C21 13.38 19.35 11.64 17.26 11.52C16.63 8.36 13.86 6 10.5 6C7.54 6 5.04 7.84 4.14 10.51C2.37 10.88 1 12.44 1 14.33C1 16.64 3.03 19.5 6 19.5Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round" />
      </g>

      <!-- Overcast / Cloudy -->
      <g id="icon-overcast">
        <path d="M7 19H17.5C19.71 19 21.5 17.21 21.5 15C21.5 12.89 19.88 11.16 17.81 11.02C17.15 7.63 14.17 5 10.5 5C7.23 5 4.46 7.14 3.57 10.15C1.83 10.61 0.5 12.19 0.5 14.07C0.5 16.79 2.71 19 7 19Z" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round" />
      </g>

      <!-- Foggy / Mist -->
      <g id="icon-fog">
        <path d="M5 9C5 6.24 7.24 4 10 4C12.38 4 14.37 5.66 14.87 7.9C15.34 7.65 15.89 7.5 16.47 7.5C18.42 7.5 20 9.08 20 11.03C20 11.4 19.94 11.75 19.83 12.07" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" />
        <path d="M3 14H21M5 17H19M7 20H17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Drizzle -->
      <g id="icon-drizzle">
        <path d="M6 14H17C19.21 14 21 12.21 21 10C21 7.89 19.35 6.16 17.26 6.02C16.63 2.86 13.86 0.5 10.5 0.5C7.54 0.5 5.04 2.34 4.14 5.01C2.37 5.38 1 6.94 1 8.83C1 11.14 3.03 14 6 14Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round" />
        <path d="M8 17L7 19M12 17L11 19M16 17L15 19M9.5 21L8.5 23M13.5 21L12.5 23" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </g>

      <!-- Rain -->
      <g id="icon-rain">
        <path d="M6 13H17C19.21 13 21 11.21 21 9C21 6.89 19.35 5.16 17.26 5.02C16.63 1.86 13.86 -0.5 10.5 -0.5C7.54 -0.5 5.04 1.34 4.14 4.01C2.37 4.38 1 5.94 1 7.83C1 10.14 3.03 13 6 13Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round" />
        <path d="M7 16L5 21M12 16L10 21M17 16L15 21" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Snow -->
      <g id="icon-snow">
        <path d="M6 13H17C19.21 13 21 11.21 21 9C21 6.89 19.35 5.16 17.26 5.02C16.63 1.86 13.86 -0.5 10.5 -0.5C7.54 -0.5 5.04 1.34 4.14 4.01C2.37 4.38 1 5.94 1 7.83C1 10.14 3.03 13 6 13Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round" />
        <path d="M7 17V21M5 19H9M12 16V22M10 19H14M17 17V21M15 19H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </g>

      <!-- Thunderstorm -->
      <g id="icon-thunderstorm">
        <path d="M6 13H17C19.21 13 21 11.21 21 9C21 6.89 19.35 5.16 17.26 5.02C16.63 1.86 13.86 -0.5 10.5 -0.5C7.54 -0.5 5.04 1.34 4.14 4.01C2.37 4.38 1 5.94 1 7.83C1 10.14 3.03 13 6 13Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round" />
        <path d="M12 14L9 19H13L11 23.5L16 17H12.5L14 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>
    </defs>
  </svg>

  <div class="app-shell">
    <!-- Header Section -->
    <header class="app-header">
      <div class="brand-row">
        <div class="brand-info">
          <div class="brand-badge">
            <span class="live-dot" aria-hidden="true"></span>
            <span>OPEN-METEO LIVE</span>
          </div>
          <h1 class="brand-title">Live Weather Dashboard</h1>
          <p class="brand-subtitle">Real-time meteorological insights and 5-day atmospheric forecasting</p>
        </div>
      </div>

      <!-- Search Section Form -->
      <form id="search-form" class="search-form" role="search" novalidate>
        <div class="search-input-wrapper">
          <svg class="search-icon" aria-hidden="true">
            <use href="#icon-search" xlink:href="#icon-search"></use>
          </svg>
          <input
            type="text"
            id="city-input"
            class="city-input"
            placeholder="Search city (e.g. Pune, London, Tokyo, New York)..."
            autocomplete="off"
            spellcheck="false"
            aria-label="City search input"
          >
        </div>
        <button type="submit" id="search-btn" class="search-submit-btn">
          <span>Search</span>
        </button>
      </form>

      <!-- Quick Search City Pills -->
      <div class="quick-cities" aria-label="Suggested cities">
        <span class="quick-label">Trending:</span>
        <div class="quick-pills-list">
          <button type="button" class="city-pill" data-city="Pune">Pune</button>
          <button type="button" class="city-pill" data-city="Mumbai">Mumbai</button>
          <button type="button" class="city-pill" data-city="London">London</button>
          <button type="button" class="city-pill" data-city="Tokyo">Tokyo</button>
          <button type="button" class="city-pill" data-city="New York">New York</button>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-container">
      <!-- Status & Alert Notification Banner -->
      <div id="status-banner" class="status-banner hidden" role="status" aria-live="polite">
        <div class="status-icon-box" id="status-icon-box" aria-hidden="true"></div>
        <p class="status-message" id="status-message"></p>
      </div>

      <!-- Weather Dashboard Container -->
      <div id="weather-content" class="weather-content hidden">
        <!-- Current Weather Showcase Card (Populated safely via DOM APIs) -->
        <section class="current-weather-card" id="current-weather" aria-label="Current Weather Conditions">
          <!-- Injected via script.js -->
        </section>

        <!-- 5-Day Forecast Grid Section -->
        <section class="forecast-section" aria-label="5-Day Weather Forecast">
          <div class="forecast-header">
            <h2 class="forecast-title">5-Day Atmospheric Forecast</h2>
            <span class="forecast-badge">Extended Outlook</span>
          </div>
          <!-- 5-Column Forecast Grid (Populated safely via DOM APIs) -->
          <div class="forecast-grid" id="forecast-grid">
            <!-- Injected via script.js -->
          </div>
        </section>
      </div>
    </main>

    <!-- Footer Documentation & Attribution -->
    <footer class="app-footer">
      <p class="footer-note">InternCircle Project 04 &bull; Built with HTML5, CSS3 &amp; Vanilla JavaScript</p>
      <p class="footer-attribution">Data provided by <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo API</a> &bull; Keyless &amp; Open-Source</p>
    </footer>
  </div>

  <!-- Application Logic -->
  <script src="script.js"></script>
</body>
</html>
